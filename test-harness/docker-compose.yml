services:
  upstream-wan:
    build:
      context: ..
      dockerfile: test-harness/docker/Dockerfile.node
    container_name: upstream-wan
    entrypoint: ["/usr/local/bin/wan-entrypoint.sh"]
    networks:
      wan_net:
        ipv4_address: 172.30.1.100

  roostos-router:
    build:
      context: ..
      dockerfile: test-harness/docker/Dockerfile.router
    container_name: roostos-router
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    ports:
      - "8080:8000"
    environment:
      - ROOSTOS_SESSION_BUS=0
      - ROOSTOS_MOCK_AUTH=1
      - ROOSTOS_CONFIG_DIR=/etc/roostos
      - ROOSTOS_NFTABLES_CONF=/etc/nftables.conf
    volumes:
      - ../:/workspace
      - ./staged-config:/etc/roostos
    networks:
      mgmt_net:
        ipv4_address: 172.30.0.2
      wan_net:
        ipv4_address: 172.30.1.2
      lan_net:
        ipv4_address: 172.30.2.1
      guest_net:
        ipv4_address: 172.30.3.1
    depends_on:
      - upstream-wan

  client-lan:
    build:
      context: ..
      dockerfile: test-harness/docker/Dockerfile.node
    container_name: client-lan
    cap_add:
      - NET_ADMIN
    mac_address: "02:42:ac:1e:02:32"
    environment:
      - ROUTER_GATEWAY=172.30.2.1
    networks:
      lan_net:
        ipv4_address: 172.30.2.50
    depends_on:
      - roostos-router

  client-guest:
    build:
      context: ..
      dockerfile: test-harness/docker/Dockerfile.node
    container_name: client-guest
    cap_add:
      - NET_ADMIN
    mac_address: "02:42:ac:1e:03:32"
    environment:
      - ROUTER_GATEWAY=172.30.3.1
    networks:
      guest_net:
        ipv4_address: 172.30.3.50
    depends_on:
      - roostos-router

  test-runner:
    build:
      context: ..
      dockerfile: test-harness/docker/Dockerfile.runner
    container_name: test-runner
    environment:
      - ROOSTOS_ROUTER_URL=http://roostos-router:8000
      - WAN_HOST=172.30.1.100
      - PYTHONPATH=/workspace
    volumes:
      - ../:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      mgmt_net:
        ipv4_address: 172.30.0.10
    depends_on:
      - roostos-router
      - client-lan
      - client-guest

networks:
  mgmt_net:
    name: roostos_mgmt_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  wan_net:
    name: roostos_wan_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  lan_net:
    name: roostos_lan_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24
  guest_net:
    name: roostos_guest_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.3.0/24
