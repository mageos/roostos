[project]
name = "roostos-engine"
dynamic = ["version"]
description = "Core management daemon and CLI for RoostOS router"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "dbus-next>=0.2.3",
    "click>=8.0.0",
    "docker>=7.0.0",
    "prompt-toolkit>=3.0.0",
    "cryptography>=42.0.0",
    "injector>=0.21.0",
    "roostos-sdk",
]

[project.scripts]
roostd = "roostos_engine.daemon:main"
roostctl = "roostos_engine.cli:main"
roostos-setup = "roostos_engine.setup_tool:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
roostos-sdk = { workspace = true }
