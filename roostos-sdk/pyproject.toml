[project]
name = "roostos-sdk"
version = "0.1.0"
description = "Python SDK for building RoostOS extensions and D-Bus interfaces"
readme = "../readme.md"
requires-python = ">=3.10"
dependencies = [
    "dbus-next>=0.2.3",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
