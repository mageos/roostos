name: Build Debian Packages

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Target architectures to build (e.g. "amd64", "arm64", or "amd64 arm64")'
        required: false
        default: 'amd64 arm64'
        type: string

permissions:
  contents: write

jobs:
  build-debian-packages:
    name: Build RoostOS Debian Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for arm64 cross-building)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev file

      - name: Compute Dynamic Version
        run: |
          python3 scripts/version.py --write
          echo "ROOSTOS_VERSION=$(cat VERSION)" >> $GITHUB_ENV
          echo "Computed RoostOS Version: $(cat VERSION)"

      - name: Build Debian Packages
        env:
          TARGET_ARCHS: ${{ github.event.inputs.architectures || 'amd64 arm64' }}
        run: |
          echo "Building target architectures: $TARGET_ARCHS"
          bash scripts/build-all-debs.sh $TARGET_ARCHS

      - name: Verify Package Contents
        run: |
          ls -lh dist/debs/
          for deb in dist/debs/*.deb; do
            echo "=== Package: $deb ==="
            dpkg -I "$deb"
          done

      - name: Determine Artifact Name
        id: artifact_meta
        run: |
          REF_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$REF_NAME" =~ ^feature/(.+) ]]; then
            FEATURE="${BASH_REMATCH[1]}"
            CLEAN_NAME=$(echo "$FEATURE" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-')
            echo "name=roostos-debian-packages-${CLEAN_NAME}" >> $GITHUB_OUTPUT
          elif [[ "$REF_NAME" =~ ^release/(.+) ]]; then
            RELEASE="${BASH_REMATCH[1]}"
            CLEAN_NAME=$(echo "$RELEASE" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-')
            echo "name=roostos-debian-packages-release-${CLEAN_NAME}" >> $GITHUB_OUTPUT
          else
            echo "name=roostos-debian-packages-main" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debian Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: dist/debs/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Attach Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/debs/*.deb
          generate_release_notes: true
