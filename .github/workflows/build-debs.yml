name: Build Debian Packages

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Target architectures to build (e.g. "amd64", "arm64", or "amd64 arm64")'
        required: false
        default: 'amd64 arm64'
        type: string

permissions:
  contents: write

jobs:
  build-debian-packages:
    name: Build RoostOS Debian Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for arm64 cross-building)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev file

      - name: Build Debian Packages
        env:
          TARGET_ARCHS: ${{ github.event.inputs.architectures || 'amd64 arm64' }}
        run: |
          echo "Building target architectures: $TARGET_ARCHS"
          bash scripts/build-all-debs.sh $TARGET_ARCHS

      - name: Verify Package Contents
        run: |
          ls -lh dist/debs/
          for deb in dist/debs/*.deb; do
            echo "=== Package: $deb ==="
            dpkg -I "$deb"
          done

      - name: Upload Debian Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roostos-debian-packages
          path: dist/debs/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Attach Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/debs/*.deb
          generate_release_notes: true
