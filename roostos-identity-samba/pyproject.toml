[project]
name = "roostos-identity-samba"
version = "0.1.0"
description = "Samba Active Directory & Identity Sidecar Bridge for RoostOS"
requires-python = ">=3.10"
dependencies = [
    "dbus-next>=0.2.3",
    "roostos-sdk",
    "ldap3>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
roostos-sdk = { workspace = true }
