<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoostOS Router Dashboard</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 1. Left Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-logo">
                <span class="logo-dot"></span>
                <h1>RoostOS</h1>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" id="nav-status" onclick="switchView('status')">Status</button>
                
                <div class="nav-section" id="section-connectivity">
                    <div class="nav-header" onclick="toggleSidebarSection('connectivity')">
                        <span>Connectivity</span>
                        <span class="collapse-icon">▼</span>
                    </div>
                    <div class="nav-section-content">
                        <button class="nav-item" id="nav-networks" onclick="switchView('networks')">Networks</button>
                        <button class="nav-item" id="nav-dhcp" onclick="switchView('dhcp')">DHCP Server</button>
                        <button class="nav-item" id="nav-vpn" onclick="switchView('vpn')">VPN Connections</button>
                    </div>
                </div>
                
                <div class="nav-section" id="section-security">
                    <div class="nav-header" onclick="toggleSidebarSection('security')">
                        <span>Security</span>
                        <span class="collapse-icon">▼</span>
                    </div>
                    <div class="nav-section-content">
                        <button class="nav-item" id="nav-firewall" onclick="switchView('firewall')">Firewall</button>
                        <button class="nav-item" id="nav-parental" onclick="switchView('parental')">Parental Controls</button>
                        <button class="nav-item" id="nav-dns" onclick="switchView('dns')">DNS Server</button>
                    </div>
                </div>
                
                <div class="nav-section" id="section-management">
                    <div class="nav-header" onclick="toggleSidebarSection('management')">
                        <span>Management</span>
                        <span class="collapse-icon">▼</span>
                    </div>
                    <div class="nav-section-content">
                        <button class="nav-item" id="nav-people" onclick="switchView('people')">People</button>
                        <button class="nav-item" id="nav-locations" onclick="switchView('locations')">Locations</button>
                        <button class="nav-item" id="nav-devices" onclick="switchView('devices')">Devices</button>
                        <button class="nav-item" id="nav-plugins" onclick="switchView('plugins')">Plugins</button>
                        <button class="nav-item" id="nav-system" onclick="switchView('system')">System</button>
                    </div>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="theme-toggle-container">
                    <span>Theme:</span>
                    <select id="theme-select" class="theme-select" onchange="changeTheme(this.value)">
                        <option value="auto">System Default</option>
                        <option value="light">Light Mode</option>
                        <option value="dark">Dark Mode</option>
                    </select>
                </div>
                <div style="font-size: 11px; color: var(--text-secondary); text-align: center; margin-bottom: 8px;">
                    RoostOS Console <span id="footer-version">-</span>
                </div>
                <button class="nav-item" onclick="logout()" style="color: var(--accent-red); background: rgba(239, 68, 68, 0.05);">Logout</button>
            </div>
        </aside>

        <!-- 2. Main Panel View Content -->
        <main class="main-content">
            <header class="app-header">
                <div class="header-breadcrumb">
                    <span class="breadcrumb-category" id="breadcrumb-category">Overview</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-title" id="view-title">Status Dashboard</span>
                </div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="system-status">
                        <span class="pulse-dot"></span>
                        <span id="header-status">Online</span>
                    </div>
                    <div class="user-badge" style="font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid var(--card-border);">
                        <span>User: <strong id="user-display-name" style="color: var(--text-primary); font-weight: 500;">-</strong></span>
                        <span id="user-display-role" class="badge badge-outline" style="font-size: 10px; padding: 1px 6px;">-</span>
                    </div>
                </div>
            </header>

            <div class="view-container">
            </div>
        </main>
    </div>
    <script src="js/services/extension-registry.js" type="module"></script>
    <script src="js/services/auth-service.js"></script>
    <script src="js/services/network-service.js"></script>
    <script src="js/services/device-service.js"></script>
    <script src="js/services/security-service.js"></script>
    <script src="js/services/system-service.js"></script>
    <script src="js/components/status-component.js"></script>
    <script src="js/components/people-list.js" type="module"></script>
    <script src="js/components/user-list.js" type="module"></script>
    <script src="js/components/network-interfaces.js" type="module"></script>
    <script src="js/components/network-bridges.js" type="module"></script>
    <script src="js/components/network-zones.js" type="module"></script>
    <script src="js/components/wifi-management.js" type="module"></script>
    <script src="js/components/dhcp-management.js" type="module"></script>
    <script src="js/components/qos-settings.js" type="module"></script>
    <script src="js/components/network-view.js" type="module"></script>
    <script src="js/components/device-list.js" type="module"></script>
    <script src="js/components/firewall-rules.js" type="module"></script>
    <script src="app.js"></script>
</body>
</html>
