[project]
name = "roostos-web"
version = "0.1.0"
description = "FastAPI web management service and SPA host for RoostOS"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.20.0",
    "python-pam>=2.0.0",
    "pyjwt>=2.0.0",
    "httpx>=0.24.0",
    "six",
    "python-multipart",
    "roostos-sdk",
    "roostos-engine",
    "injector>=0.21.0",
]

[project.scripts]
roostos-web = "roostos_web.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
roostos-sdk = { workspace = true }
roostos-engine = { workspace = true }
