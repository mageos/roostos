[project]
name = "roostos-cli"
dynamic = ["version"]
description = "Universal root CLI and setup wizard for RoostOS"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
roostos = "roostos_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
